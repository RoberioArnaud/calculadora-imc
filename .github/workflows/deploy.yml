name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  preparar:
    name: Preparar site
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Obter o código aprovado pelo CI
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Separar arquivos do site
        run: |
          mkdir _site
          cp index.html style.css script.js _site/

      - name: Enviar artefato do site
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

  publicar:
    name: Publicar no GitHub Pages
    needs: preparar
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publicar site
        id: deploy
        uses: actions/deploy-pages@v5.0.1

  dast:
    name: DAST com OWASP ZAP
    needs: publicar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter configuração do ZAP aprovada pelo CI
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Analisar o site publicado
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ needs.publicar.outputs.page_url }}
          cmd_options: '-c .zap/rules.tsv --hook /zap/wrk/.zap/hooks.py'
          allow_issue_writing: false
          fail_action: true
          artifact_name: relatorio-zap
